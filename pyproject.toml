[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["src", "portal_bots", "portal_contracts"]

[tool.pyright]
include = ["api/src", "bots/portal_bots", "packages/contracts/portal_contracts"]
extraPaths = ["api", "bots", "packages/contracts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api", "bots", "packages/contracts"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["integration: requires an isolated MySQL and Redis", "unit: isolated policy and contract tests", "api: native API tests"]
