[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "portal-contracts==0.1.0",
  "papilio[server,db,mcp] @ https://codeload.github.com/stupidprogrammer4/papilio/tar.gz/e026dbc9aa335ab4f6cc79f7ff2aecb198bd93ad",
  "papilio-tasks[scheduler-redis] @ https://codeload.github.com/stupidprogrammer4/papilio-tasks/tar.gz/bca239763eab5c0d176b5ac8af9e878edb6997a7",
  "httpx==0.28.1", "aiohttp==3.14.3", "aiomysql==0.3.2",
  "alembic==1.20.0", "python-dotenv==1.2.4", "PyYAML==6.0.3",
  "mcp==2.2.0", "beautifulsoup4==4.15.0", "defusedxml==0.7.1", "persiantools==5.5.1",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.16.8", "pyright==1.1.414", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
include = ["src*"]
