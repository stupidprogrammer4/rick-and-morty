# Install only after inspecting the existing ingress and certificate ownership.
server {
    listen 80;
    listen [::]:80;
    server_name bot.amupouya.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portal-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot.amupouya.org;
    ssl_certificate /etc/letsencrypt/live/bot.amupouya.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.amupouya.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location = /health/live {
        access_log off;
        proxy_pass http://127.0.0.1:18011;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /telegram/rick {
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:18011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location = /telegram/morty {
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:18011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
