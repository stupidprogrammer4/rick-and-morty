# Include inside an existing TLS server block after checking nginx -T.
# Only Telegram webhook routes are public. API and internal bot routes stay private.
location = /telegram/rick {
    client_max_body_size 512k;
    proxy_pass http://127.0.0.1:18011;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location = /telegram/morty {
    client_max_body_size 512k;
    proxy_pass http://127.0.0.1:18011;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location = /telegram/media {
    client_max_body_size 512k;
    proxy_pass http://127.0.0.1:18011;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
