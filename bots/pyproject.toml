[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-bots"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "portal-contracts==0.1.0", "aiogram==3.31.0", "aiohttp==3.14.3",
  "httpx==0.28.1", "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
include = ["portal_bots*"]
